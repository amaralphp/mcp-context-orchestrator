name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcporch_test
          POSTGRES_USER: mcporch
          POSTGRES_PASSWORD: mcporch_pass
        ports:
          - 5433:5432
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mcporch_test
          MYSQL_USER: mcporch
          MYSQL_PASSWORD: mcporch_pass
          MYSQL_ROOT_PASSWORD: root_pass
        ports:
          - 3307:3306
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_DATABASE: mcporch_test
          MONGO_INITDB_ROOT_USERNAME: mcporch
          MONGO_INITDB_ROOT_PASSWORD: mcporch_pass
        ports:
          - 27018:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Checkstyle
        run: mvn checkstyle:check -B

      - name: PMD
        run: mvn pmd:check -B

      - name: Build and Test
        run: mvn verify -B
        env:
          SPRING_PROFILES_ACTIVE: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/mcporch_test
          SPRING_DATASOURCE_USERNAME: mcporch
          SPRING_DATASOURCE_PASSWORD: mcporch_pass
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Upload JaCoCo Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
